[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-batch-pipeline"
version = "0.1.0"
description = "Batch MLOps pipeline for hourly retail demand forecasting"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "ML Platform Team"}]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "pyarrow>=14.0",
  "torch>=2.0,<2.2",
  "pytorch-lightning>=2.0",
  "pytorch-forecasting>=1.0",
  "optuna>=3.0",
  "lightgbm>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
